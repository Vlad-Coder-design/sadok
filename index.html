<style>
:root{
  --sky-top:#BFE3F5; --sky-mid:#E4F3F8; --sky-low:#FBF7F0;
  --ink:#1F2A44; --ink-soft:#3E4F66; --accent:#C2581A; --panel:rgba(251,247,240,.86); --line:#E3D9C8;

}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.top{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:20px 16px 0;pointer-events:none}
.eyebrow{font:800 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font:600 clamp(24px,4vw,40px)/1.1 var(--display);margin:0}
.by{margin:6px 0 0;color:var(--ink-soft);font-size:14px}
.hint{margin:0;color:var(--ink-soft);font-size:14px;max-width:34ch}
.stage{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 22%;touch-action:none;cursor:grab;overflow:hidden}
.stage.drag{cursor:grabbing}
.sun{position:absolute;right:6%;top:4%;width:min(30vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFF6CC 0 20%,rgba(255,224,138,.55) 34%,rgba(255,224,138,0) 70%);pointer-events:none}
.s{position:absolute;left:50%;top:58%;transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden}
.bar{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);max-width:calc(100% - 32px)}
.bar button{font:700 14px/1 var(--body);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;min-height:40px}
.bar button:hover{background:rgba(31,42,68,.08)}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--sky-low)}
@media (max-width:520px){.hint{display:none}}
</style>
</head>

<div class="app">
<div class="top">
<div><p class="eyebrow">Інтерактивна модель</p><h1>Дитячий садок майбутнього</h1><p class="by">Добжанська Крістіна Олександрівна · група № 3 ДО 1/3</p></div>
<p class="hint">Тягніть мишею або пальцем, щоб покрутити. Коліщатко миші або два пальці наближають.</p>
</div>

<button id="zout" type="button">− Далі</button>
<button id="reset" type="button">Скинути вигляд</button>
</div>
</div>
